# Random boot failures 2026-10-07: noctalia-greeter's compositor started ~2 ms after plymouth
# was told to quit and got "Could not take device /dev/dri/card2: Device or resource busy",
# then greetd gave up -> no login screen. Same root fs booted fine at other times, and it
# failed even with cpu-boost/ryzenadj-tune masked, so it's a start-up race.
# Give the GPU a few seconds to be released before the greeter starts.
# Remove: sudo rm -r /etc/systemd/system/greetd.service.d && sudo systemctl daemon-reload
[Service]
ExecStartPre=/usr/bin/sleep 3
