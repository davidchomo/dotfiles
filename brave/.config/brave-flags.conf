# Read by /usr/bin/brave (brave-bin). Hardware video decode/encode on the AMD iGPU via VA-API
# (Wayland). Without these, Brave 1.96 still decoded video on the CPU on this G14.
--ozone-platform=wayland
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
