# MangoHud – compact overlay, top-left. Toggle: Shift+F12. Enable per game with launch option "mangohud".
legacy_layout=false
position=top-left
round_corners=10
background_alpha=0.55
background_color=1a120e
font_size=20
text_color=f1dfd8
horizontal
hud_compact
table_columns=4

# what to show
fps
frametime
frame_timing=1
gpu_name
gpu_stats
gpu_temp
gpu_power
gpu_text=GPU
gpu_color=e6bead
vram
vram_color=d1c88f
cpu_stats
cpu_temp
cpu_text=CPU
cpu_color=ffb694
ram
ram_color=d1c88f
gamemode
fps_color_change
fps_value=30,60
fps_color=ff6b5b,ffb694,9bd48a
frametime_color=ffb694

# FPS limit (laptop: both chips share one cooler; an uncapped game runs CPU+GPU at 100 %).
# Shift_L+F1 cycles 60 -> 120 -> unlimited.
fps_limit=60,120,0
fps_limit_method=late
toggle_fps_limit=Shift_L+F1

# controls
reload_cfg=Shift_L+F4
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
output_folder=~/benchmarks/mangohud
